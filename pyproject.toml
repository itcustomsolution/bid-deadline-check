[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata (license = "MIT", license-files)
build-backend = "hatchling.build"

[project]
name = "bid-deadline-check"
version = "0.2.1"
description = "Local review aid for solicitation deadlines and requirements. Rule-based extraction with explicit human-review flags."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "IT Custom Solution" }]
keywords = ["govcon", "rfp", "solicitation", "proposal", "compliance", "deadline", "sam.gov"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
  "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=6.21.1"]
dev = ["pytest>=8", "pypdf>=6.21.1"]

[project.scripts]
bid-deadline-check = "bid_deadline_check.cli:main"

[project.urls]
"IT Custom Solution" = "https://itcustomsolution.com"
Repository = "https://github.com/itcustomsolution/bid-deadline-check"
Changelog = "https://github.com/itcustomsolution/bid-deadline-check/blob/main/CHANGELOG.md"
Homepage = "https://github.com/itcustomsolution/bid-deadline-check"
Issues = "https://github.com/itcustomsolution/bid-deadline-check/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bid_deadline_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
